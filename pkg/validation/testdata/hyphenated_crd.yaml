apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: hyphen-resources.tr.ccrn.example.com
  annotations:
    ccrn/v1.urn-template: "urn:ccrn:<ccrn>/<instance>"
spec:
  group: tr.ccrn.example.com
  names:
    kind: HyphenResource
    listKind: HyphenResourceList
    plural: hyphen-resources
    singular: hyphen-resource
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: ["ccrn", "instance"]
          properties:
            ccrn:
              type: string
              enum: ["hyphen-resource.tr.ccrn.example.com/v1"]
            instance:
              type: string
              pattern: "^([a-z0-9]([-a-z0-9.]*[a-z0-9])?|\\*)$"
