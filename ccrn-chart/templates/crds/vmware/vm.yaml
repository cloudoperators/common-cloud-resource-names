apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
    name: vms.vmware.{{ .Values.ccrn.apiGroup }}
    annotations:
        ccrn/v1.urn-template: "urn:ccrn:<ccrn>/<instance>/<datacenter>/<name>"
spec:
    group: vmware.{{ .Values.ccrn.apiGroup }}
    names:
        kind: vm
        listKind: vmList
        plural: vms
        singular: vm
    scope: Namespaced
    versions:
        -   name: v1
            served: true
            storage: true
            schema:
                openAPIV3Schema:
                    type: object
                    required: [ "ccrn", "instance", "datacenter", "name" ]
                    properties:
                        ccrn:
                            type: string
                            enum: [ "vm.vmware.{{ .Values.ccrn.apiGroup }}/v1" ]
                        instance:
                            type: string
                            description: "vCenter Server instance FQDN"
                            pattern: "^([a-z0-9]([a-z0-9.-]*[a-z0-9])?|\\*)$"
                            maxLength: 253
                        datacenter:
                            type: string
                            description: "Parent datacenter name"
                            pattern: "^([a-zA-Z0-9]([a-zA-Z0-9._-]*[a-zA-Z0-9])?|\\*)$"
                            maxLength: 80
                        name:
                            type: string
                            description: "Virtual machine name"
                            pattern: "^([a-zA-Z0-9]([a-zA-Z0-9._-]*[a-zA-Z0-9])?|\\*)$"
                            maxLength: 80
            additionalPrinterColumns:
                -   name: CCRN
                    type: string
                    jsonPath: .ccrn
                -   name: Instance
                    type: string
                    jsonPath: .instance
                -   name: Datacenter
                    type: string
                    jsonPath: .datacenter
                -   name: Name
                    type: string
                    jsonPath: .name
                -   name: Age
                    type: date
                    jsonPath: .metadata.creationTimestamp
