apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
    name: datacenters.vmware.{{ .Values.ccrn.apiGroup }}
    annotations:
        ccrn/v1.urn-template: "urn:ccrn:<ccrn>/<instance>/<name>"
spec:
    group: vmware.{{ .Values.ccrn.apiGroup }}
    names:
        kind: datacenter
        listKind: datacenterList
        plural: datacenters
        singular: datacenter
    scope: Namespaced
    versions:
        -   name: v1
            served: true
            storage: true
            schema:
                openAPIV3Schema:
                    type: object
                    required: [ "ccrn", "instance", "name" ]
                    properties:
                        ccrn:
                            type: string
                            enum: [ "datacenter.vmware.{{ .Values.ccrn.apiGroup }}/v1" ]
                        instance:
                            type: string
                            description: "vCenter Server instance FQDN"
                            pattern: "^([a-z0-9]([a-z0-9.-]*[a-z0-9])?|\\*)$"
                            maxLength: 253
                        name:
                            type: string
                            description: "Datacenter name"
                            pattern: "^([a-zA-Z0-9]([a-zA-Z0-9._-]*[a-zA-Z0-9])?|\\*)$"
                            maxLength: 80
            additionalPrinterColumns:
                -   name: CCRN
                    type: string
                    jsonPath: .ccrn
                -   name: Instance
                    type: string
                    jsonPath: .instance
                -   name: Name
                    type: string
                    jsonPath: .name
                -   name: Age
                    type: date
                    jsonPath: .metadata.creationTimestamp
