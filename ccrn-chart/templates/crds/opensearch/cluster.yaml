apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
    name: clusters.opensearch.{{ .Values.ccrn.apiGroup }}
    annotations:
        ccrn/v1.urn-template: "urn:ccrn:<ccrn>/<fqdn>"
spec:
    group: opensearch.{{ .Values.ccrn.apiGroup }}
    names:
        kind: cluster
        listKind: clusterList
        plural: clusters
        singular: cluster
    scope: Namespaced
    versions:
        -   name: v1
            served: true
            storage: true
            schema:
                openAPIV3Schema:
                    type: object
                    required: [ "ccrn", "fqdn" ]
                    properties:
                        ccrn:
                            type: string
                            enum: [ "cluster.opensearch.{{ .Values.ccrn.apiGroup }}/v1" ]
                        fqdn:
                            type: string
                            description: "OpenSearch cluster endpoint FQDN"
                            pattern: "^([a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?(\\.[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?)*|\\*(\\.([a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?))*|\\*)$"
            additionalPrinterColumns:
                -   name: CCRN
                    type: string
                    jsonPath: .ccrn
                -   name: FQDN
                    type: string
                    jsonPath: .fqdn
                -   name: Age
                    type: date
                    jsonPath: .metadata.creationTimestamp
